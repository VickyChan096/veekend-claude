# 建置並部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  # 也可以到 Actions 分頁手動觸發
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，但不中斷進行中的那個
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ⚠ 用 v5：v4 是為 Node 20 寫的，runner 會強制它跑在 Node 24 上
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Show toolchain versions
        run: node --version && npm --version

      # npm 的輸出同時寫成 annotation——annotation 不需要 repo admin 權限就讀得到，
      # 免得每次除錯都得人工去 Actions 頁面複製訊息
      - name: Install dependencies
        run: |
          set +e
          npm ci > npm-ci.log 2>&1
          code=$?
          cat npm-ci.log
          if [ $code -ne 0 ]; then
            node -e "const fs=require('fs');const t=fs.readFileSync('npm-ci.log','utf8').split('\n').slice(-40).join('%0A');console.log('::error::npm ci failed (exit '+process.argv[1]+')%0A'+t)" "$code"
          fi
          exit $code

      - name: Typecheck
        run: npm run check

      - name: Generate static site
        env:
          # 自動用 repo 名稱當子路徑，改名或搬 repo 都不用改設定。
          # 站台網址會是 https://<owner>.github.io/<repo>/
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run generate

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # repo 還沒開 Pages 時自動幫忙開啟，省去手動到 Settings 設定
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
